verified_queries:
  - name: 0;1
    question: How many parties are there in our supply chain network by type?
    sql: SELECT ENTITY_TYPE, COUNT(*) AS N FROM vw_ont_party GROUP BY 1
    verified_at: 1788377940
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What types of material flows exist in our supply chain and how many
      of each type do we have?
    sql: SELECT ENTITY_TYPE, COUNT(*) AS N FROM vw_ont_materialflow GROUP BY 1
    verified_at: 1788377940
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are all the descendants of Facility?
    sql: SELECT DESCENDANT_CLASS, DEPTH, PATH FROM vw_descendants WHERE ROOT_CLASS
      = 'Facility'
    verified_at: 1788377940
    verified_by: Semantic Model Generator
  - name: 3;1
    question: Which ontology classes are abstract and how many instances sit under
      them?
    sql: SELECT CLASS_NAME, IS_ABSTRACT, DEPTH, DESCENDANTS, DIRECT_INSTANCES FROM
      vw_ont_hierarchy_stats ORDER BY DEPTH, CLASS_NAME
    verified_at: 1788377940
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What are the ancestors of Customer?
    sql: SELECT ANCESTOR_CLASS, DEPTH FROM vw_ancestors WHERE START_CLASS = 'Customer'
      ORDER BY DEPTH
    verified_at: 1788377940
    verified_by: Semantic Model Generator
  - name: 5;1
    question: What is the distribution of entities across different types in our supply
      chain ontology?
    sql: SELECT ENTITY_TYPE, COUNT(*) AS N FROM vw_ont_all_entities GROUP BY 1 ORDER
      BY 2 DESC
