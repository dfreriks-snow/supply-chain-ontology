name: SUPPLY_CHAIN_ONTOLOGY_MODEL
description: "Abstract reasoning layer for the supply-chain ontology. Every view here\
  \ spans MULTIPLE concrete types, which is the point: VW_ONT_PARTY covers suppliers\
  \ and customers together, VW_ONT_MATERIALFLOW covers inbound, outbound and inter-plant\
  \ flows, VW_ONT_CATALOGOBJECT covers SAP processes, data products and CDS entities.\
  \ Use for cross-type questions ('which parties are affected', 'what kinds of flow\
  \ exist') and for class-hierarchy questions (ancestors, descendants, abstract vs\
  \ concrete, instance counts per class). For a named plant or a specific monthly\
  \ value, use the base semantic view instead."
