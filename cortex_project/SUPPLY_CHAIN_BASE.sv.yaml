name: SUPPLY_CHAIN_BASE
description: 'Base data layer for the SAP supply-chain network. Covers the 19 nodes
  (5 plants, 6 suppliers, 8 customers), the 27 material flows worth $56.7M a month,
  plant capacity and inventory, and material-category substitution capability. Use
  for concrete lookups: named plants, suppliers and customers, monthly volume and
  value, spare capacity, days of inventory, and which categories have an alternative
  source. For cross-type reasoning across abstract classes such as Facility or Party,
  use the ontology semantic view instead.'
tables:
  - name: V_NODE
    base_table:
      database: SAP_SUPPLY_CHAIN
      schema: SCENARIO
      table: V_NODE
    primary_key:
      columns:
        - NODE_ID
    dimensions:
      - name: NODE_ID
        expr: NODE_ID
        data_type: VARCHAR
      - name: NODE_NAME
        expr: NODE_NAME
        data_type: VARCHAR
      - name: NODE_TYPE
        expr: NODE_TYPE
        data_type: VARCHAR
      - name: CITY
        expr: CITY
        data_type: VARCHAR
      - name: COUNTRY
        expr: COUNTRY
        data_type: VARCHAR
      - name: PLANT
        expr: PLANT
        data_type: VARCHAR
    facts:
      - name: LATITUDE
        expr: LATITUDE
        data_type: NUMBER
      - name: LONGITUDE
        expr: LONGITUDE
        data_type: NUMBER
  - name: V_FLOW
    base_table:
      database: SAP_SUPPLY_CHAIN
      schema: SCENARIO
      table: V_FLOW
    dimensions:
      - name: FLOW_ID
        expr: FLOW_ID
        data_type: VARCHAR
      - name: FLOW_TYPE
        expr: FLOW_TYPE
        data_type: VARCHAR
      - name: MATERIAL_CATEGORY
        expr: MATERIAL_CATEGORY
        data_type: VARCHAR
      - name: MONTHLY_VOLUME
        expr: MONTHLY_VOLUME
        data_type: NUMBER
      - name: SOURCE_ID
        expr: SOURCE_ID
        data_type: VARCHAR
      - name: SOURCE_NAME
        expr: SOURCE_NAME
        data_type: VARCHAR
      - name: SOURCE_TYPE
        expr: SOURCE_TYPE
        data_type: VARCHAR
      - name: SOURCE_COUNTRY
        expr: SOURCE_COUNTRY
        data_type: VARCHAR
      - name: TARGET_ID
        expr: TARGET_ID
        data_type: VARCHAR
      - name: TARGET_NAME
        expr: TARGET_NAME
        data_type: VARCHAR
      - name: TARGET_TYPE
        expr: TARGET_TYPE
        data_type: VARCHAR
      - name: TARGET_COUNTRY
        expr: TARGET_COUNTRY
        data_type: VARCHAR
    facts:
      - name: MONTHLY_VALUE
        expr: MONTHLY_VALUE
        data_type: NUMBER
  - name: V_PLANT_CAPACITY
    base_table:
      database: SAP_SUPPLY_CHAIN
      schema: SCENARIO
      table: V_PLANT_CAPACITY
    primary_key:
      columns:
        - PLANT
    dimensions:
      - name: PLANT
        expr: PLANT
