relationships:
  - name: V_PLANT_CAPACITY_TO_V_PLANT_INVENTORY
    left_table: V_PLANT_CAPACITY
    right_table: V_PLANT_INVENTORY
    join_type: inner
    relationship_type: one_to_one
    relationship_columns:
      - left_column: PLANT
        right_column: PLANT
verified_queries:
  - name: 0;1
    question: Which plants ship to GlobalFoundries and what is the monthly value?
    sql: SELECT SOURCE_NAME, MATERIAL_CATEGORY, MONTHLY_VALUE FROM v_flow WHERE TARGET_NAME
      = 'GlobalFoundries'
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What is Austin Fab's spare capacity and inventory buffer?
    sql: SELECT c.PLANT_NAME, c.SPARE_UNITS, c.FREE_HRS, c.UTILIZATION_PCT, i.MIN_DAYS_OF_INVENTORY
      FROM v_plant_capacity AS c JOIN v_plant_inventory AS i ON i.PLANT = c.PLANT
      WHERE c.PLANT_NAME = 'Austin Fab'
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 2;1
    question: Which suppliers feed Penang Assembly and what are their material categories
      and monthly values?
    sql: SELECT SOURCE_NAME, MATERIAL_CATEGORY, MONTHLY_VALUE FROM v_flow WHERE TARGET_NAME
      = 'Penang Assembly' AND FLOW_TYPE = 'Inbound'
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 3;1
    question: Which material categories are single-sourced?
    sql: SELECT MATERIAL_CATEGORY, COUNT(DISTINCT SOURCE_PLANT) AS CAPABLE_PLANTS
      FROM v_substitution GROUP BY 1 HAVING COUNT(DISTINCT SOURCE_PLANT) = 1
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What is the total monthly flow value by flow type?
    sql: SELECT FLOW_TYPE, SUM(MONTHLY_VALUE) AS TOTAL_MONTHLY_VALUE FROM v_flow GROUP
      BY 1
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 5;1
    question: Which plants have the least headroom?
    sql: SELECT PLANT_NAME, UTILIZATION_PCT, HEADROOM_PCT, SPARE_UNITS FROM v_plant_capacity
      ORDER BY HEADROOM_PCT ASC
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 6;1
    question: How many plants, suppliers and customers are in the network?
    sql: SELECT NODE_TYPE, COUNT(*) AS NODE_COUNT FROM v_node GROUP BY 1
    verified_at: 1788377577
    verified_by: Semantic Model Generator
  - name: 7;1
    question: Which customers receive the most value each month?
    sql: SELECT TARGET_NAME, SUM(MONTHLY_VALUE) AS MONTHLY_VALUE FROM v_flow WHERE
      TARGET_TYPE = 'Customer' GROUP BY 1 ORDER BY 2 DESC
    verified_at: 1788377577
    verified_by: Semantic Model Generator