relationships:
  - name: ONT_CLASS_MAP_TO_ONT_CLASS
    left_table: ONT_CLASS_MAP
    right_table: ONT_CLASS
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: CLASS_NAME
        right_column: CLASS_NAME
  - name: REL_EDGE_INFERRED_TO_ONT_RULE
    left_table: REL_EDGE_INFERRED
    right_table: ONT_RULE
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: RULE_ID
        right_column: RULE_ID
verified_queries:
  - name: 0;1
    question: Which ontology classes map to which physical tables?
    sql: SELECT CLASS_NAME, SOURCE_DATABASE, SOURCE_SCHEMA, SOURCE_TABLE, FILTER_COL,
      FILTER_VAL FROM ont_class_map ORDER BY CLASS_NAME
    verified_at: 1788377977
    verified_by: Semantic Model Generator
  - name: 1;1
    question: Which inference rules are enabled and how many edges do they produce?
    sql: SELECT r.RULE_ID, r.RULE_KIND, r.TARGET_REL, r.IS_ENABLED, COUNT(e.SRC_ID)
      AS EDGES_DERIVED FROM ont_rule AS r LEFT JOIN rel_edge_inferred AS e ON e.RULE_ID
      = r.RULE_ID GROUP BY 1, 2, 3, 4
    verified_at: 1788377977
    verified_by: Semantic Model Generator
  - name: 2;1
    question: Which SAP data products expose the most CDS entities?
    sql: SELECT PRODUCT_LABEL, PRODUCT_ENTITY_COUNT FROM v_product ORDER BY PRODUCT_ENTITY_COUNT
      DESC LIMIT 20
    verified_at: 1788377977
    verified_by: Semantic Model Generator
  - name: 3;1
    question: Which classes have no physical mapping?
    sql: SELECT c.CLASS_NAME, c.IS_ABSTRACT FROM ont_class AS c LEFT JOIN ont_class_map
      AS m ON m.CLASS_NAME = c.CLASS_NAME WHERE m.CLASS_NAME IS NULL
    verified_at: 1788377977
    verified_by: Semantic Model Generator