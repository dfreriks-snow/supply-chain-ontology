name: SUPPLY_CHAIN_METADATA_MODEL
description: "Governance and provenance layer. Answers questions about the ontology\
  \ itself rather than about the supply chain: which classes exist, what they map\
  \ to physically, which relations are abstract or inferred, which inference rules\
  \ are enabled and how many edges they derive, which properties and interfaces are\
  \ declared, and who has permissions. Also covers the SAP Business Data Cloud catalog\
  \ (data products, CDS entities, business processes) as the record of what source\
  \ data exists. Use for 'how is this modelled', 'where does this come from' and coverage\
  \ questions, never for supply-chain values."
